name: Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release"
        type: boolean
        default: false
  # test is the working branch, so it is the one that gets gated and built.
  # main only ever receives commits that already passed here, so triggering on
  # it as well would run everything twice for a single commit.
  push:
    branches:
      - test
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: black --check src tests

      - name: Type check
        run: mypy src --ignore-missing-imports

      - name: Lint
        run: pylint src --fail-under=8.0

      - name: Test
        run: pytest --cov=src --cov-report=term-missing

  # The Linux job runs against mocked Windows modules. This one runs the same
  # suite against the real pywin32 and tkcalendar, which is the only place
  # API drift in those packages can surface.
  windows-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Confirm real modules are loaded
        run: |
          python -c "import win32print, pythoncom, win32com.client, tkcalendar; print('real Windows modules imported')"
          python -c "from src.word_processor import get_word_automation_status; ok, msg = get_word_automation_status(); assert ok, msg; print('Word COM bindings available')"

      - name: Report visible printers
        continue-on-error: true
        run: python -c "import win32print; print(sorted({p[2] for p in win32print.EnumPrinters(2) + win32print.EnumPrinters(4)}))"

      - name: Test against real pywin32 and tkcalendar
        run: pytest --cov=src --cov-report=term-missing

  # Builds on every push and merge, so a downloadable exe always exists for the
  # current commit. Skipped on pull requests, where the gates are the point and
  # an artifact per push to the branch would just be noise.
  build:
    needs: [quality, windows-test]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Read version
        id: version
        shell: bash
        run: |
          v=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/__init__.py').read_text()).group(1))")
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # A dispatch is a deliberate release candidate and is kept for a
          # quarter. A push build is a convenience copy of the current commit
          # and only needs to outlive a short review, so it expires in a week.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "retention=90" >> "$GITHUB_OUTPUT"
          else
            echo "retention=7" >> "$GITHUB_OUTPUT"
          fi

      - name: Build exe
        run: >
          pyinstaller
          --onefile
          --windowed
          --icon=icon.ico
          --add-data "icon.ico;."
          --add-data "icon.png;."
          --name "ShiftPrint"
          main.py

      # Tier 2 trial: confirm the packaged GUI survives startup on a runner
      # with no interactive desktop. Dropped if Tk cannot initialise here.
      - name: Smoke the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ShiftPrint.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Host "::error::ShiftPrint.exe exited during startup with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "exe stayed alive through startup"

      # Every push produces an artifact now, so the commit is part of the name;
      # otherwise a list of identically-named builds is impossible to tell apart.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShiftPrint-v${{ steps.version.outputs.value }}-${{ steps.version.outputs.sha }}
          path: dist/*.exe
          retention-days: ${{ steps.version.outputs.retention }}

      # Only ever on an explicit dispatch with the box ticked. On a push event
      # `inputs` is undefined, so this is pinned to the event as well as the flag.
      - name: Create Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: dist/*.exe
