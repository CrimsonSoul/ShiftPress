name: Security and Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube quality gate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate Cobertura coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install pinned Sonar scanner
        run: npm install --global --no-audit --no-fund @sonar/scan@5.0.0

      - name: Run Sonar finding gate
        shell: bash
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SONAR_SCOPE=(--pull-request="${{ github.event.pull_request.number }}")
          else
            SONAR_SCOPE=(--branch=main)
          fi

          node scripts/run-sonar-ci.mjs "${SONAR_SCOPE[@]}"

  snyk:
    name: Snyk security gate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install pinned Snyk scanner
        run: npm install --global --no-audit --no-fund snyk@1.1306.2

      - name: Run Snyk finding gate
        env:
          SNYK_ORG: ${{ vars.SNYK_ORG }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: node scripts/run-snyk-ci.mjs
