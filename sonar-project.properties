sonar.projectKey=CrimsonSoul_ShiftPrint
sonar.projectName=ShiftPrint
sonar.sourceEncoding=UTF-8

sonar.sources=src,main.py,tools
sonar.tests=tests
sonar.exclusions=htmlcov/**,dist/**,build/**,.venv/**,docs/**,scripts/**/*.test.mjs,**/__pycache__/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Entry points and the icon generator are exercised by running the app and by
# asserting the built assets, not by unit coverage.
sonar.coverage.exclusions=main.py,src/__init__.py,tools/**,tests/**,scripts/**

sonar.scm.provider=git
